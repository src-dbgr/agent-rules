\* TLA+ Model Checker configuration for workflow.tla
CONSTANTS
MaxCycle = 3
Nodes = {"N0", "N1", "N2", "N6", "N8", "N12", "Success", "Blocked", "Abort"}
TerminalNodes = {"Success", "Blocked", "Abort"}
ForwardEdges = {
  <<"N0", "N1">>, <<"N1", "N2">>, <<"N2", "N6">>,
  <<"N6", "N8">>, <<"N8", "N12">>, <<"N12", "Success">>
}
BackEdge = <<"N8", "N6">>

INIT cfgNode = "N0"
INIT cycle = 0
INIT terminated = FALSE
INIT stepCount = 0

CONSTRAINT stepCount <= 20

INVARIANT TerminationInvariant
INVARIANT CycleBoundInvariant

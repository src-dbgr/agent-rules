\* Mutationstest (AK-096). Dieser Lauf MUSS mit Exit != 0 enden.
\* Er benutzt dieselbe Spezifikationsdatei, aber die Sammel-Mutante SpecMutAll:
\* jede Schutzregel des Modells ist dort einmal entfernt. Endet dieser Lauf
\* gruen, pruefen die Invarianten des Hauptlaufs nichts (das war F-040) und die
\* Sonde ist wertlos. scripts/verify-proofs.sh wertet Exit 0 hier als FAIL.
\* Welche Mutante welche Eigenschaft bricht: specs/coverage.md
SPECIFICATION SpecMutAll

CONSTANTS
MaxCounter = 3
MaxOneShot = 1
MaxRotations = 2

CHECK_DEADLOCK TRUE

INVARIANT TypeOK
INVARIANT InvAttempts
INVARIANT InvOneShot
INVARIANT InvGateOnly

PROPERTY Termination
